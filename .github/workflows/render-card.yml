name: Render Card (通用)

# 通用卡片渲染 workflow：接受 card_id 参数，从 generator/projects/<card_id>/ 读取素材和配置，
# 一次性完成 Blender 构建 + GLB 导出 + 发布 + preview 渲染 + 校验 + commit。
# 优化：Blender/pip/u2net 三级缓存，避免每次重新下载。

on:
  workflow_dispatch:
    inputs:
      card_id:
        description: '卡片 ID（对应 generator/projects/<card_id>/ 目录）'
        required: true
        type: string
      tags:
        description: '风格标签，逗号分隔（如：足球,传奇）'
        required: false
        type: string
        default: ''
      date:
        description: '发布日期（YYYY-MM-DD，默认今天）'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write   # 渲染完成后自动 dispatch Deploy workflow（GITHUB_TOKEN 的 push 不会触发 on:push）

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 与本地沙箱一致（requirements.lock.txt 在 3.12 冻结）
          cache: 'pip'
          cache-dependency-path: generator/requirements.txt

      # ── 缓存 ①：Blender 便携版（190MB，最大头）──
      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: tools/
          key: blender-4.5-linux-tools-v1
          restore-keys: |
            blender-4.5-linux-tools-

      # ── 缓存 ②：u2net 模型（rembg 抠图用，~50MB）──
      - name: Cache u2net model
        id: cache-u2net
        uses: actions/cache@v4
        with:
          path: ~/.u2net/
          key: u2net-onnx-v1

      - name: Install system deps (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        # 锁文件为构建真源（精确版本，可复现）；requirements.txt 仅保留宽泛约束供人类阅读
        run: |
          if [ -f generator/requirements.lock.txt ]; then
            pip install -r generator/requirements.lock.txt
          else
            pip install -r generator/requirements.txt
          fi

      - name: Verify project exists
        run: |
          PROJECT="generator/projects/${{ inputs.card_id }}"
          if [ ! -d "$PROJECT" ]; then
            echo "❌ 项目目录不存在: $PROJECT"
            echo "可用的项目目录："
            ls -1 generator/projects/ 2>/dev/null || echo "(无)"
            exit 1
          fi
          if [ ! -f "$PROJECT/card-config.json" ]; then
            echo "❌ 缺少 card-config.json: $PROJECT/card-config.json"
            exit 1
          fi
          if [ ! -d "$PROJECT/assets" ]; then
            echo "❌ 缺少 assets/ 目录: $PROJECT/assets"
            exit 1
          fi
          echo "✅ 项目校验通过: $PROJECT"
          ls -la "$PROJECT/assets/"

      - name: Run pipeline (Blender build + GLB export)
        run: |
          PROJECT="generator/projects/${{ inputs.card_id }}"
          python3 generator/scripts/run_pipeline.py --project "$PROJECT" --skip-npm
        env:
          BLENDER_USER_CONFIG: generator/projects/${{ inputs.card_id }}/tools/blender-config

      - name: Publish card (单次：发布 + preview 渲染)
        run: |
          PROJECT="generator/projects/${{ inputs.card_id }}"
          ARGS="--project $PROJECT"
          if [ -n "${{ inputs.tags }}" ]; then
            ARGS="$ARGS --tags ${{ inputs.tags }}"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          python3 generator/scripts/publish_card.py $ARGS

      # 新 style_tags 自动补 i18n.js 词条（A#1 钩子）：先补词条，再跑测试，CI 不再因漏词条拦截
      - name: Sync i18n entries (auto-backfill)
        run: python3 generator/scripts/sync_i18n.py

      - name: Run gallery-check tests
        run: |
          cd generator
          pip install pytest -q
          python3 -m pytest tests/ -v --tb=short

      - name: Commit and push
        run: |
          git config user.name "HoloLab Bot"
          git config user.email "hololab-bot@users.noreply.github.com"
          CARD_ID="${{ inputs.card_id }}"
          git add "gallery/cards/$CARD_ID/"
          git add gallery/cards.json
          git add gallery/curation.json
          git add "generator/projects/$CARD_ID/assets/"
          git add "generator/projects/$CARD_ID/card-config.json"
          git status --short
          if git diff --cached --quiet; then
            echo "⚠️ 没有变更需要提交"
          else
            git commit -m "feat(card): render $CARD_ID via generic workflow [skip ci]"
            # 并发渲染时多个 run 会同时 push：while 循环 + 自动解决，直到成功或 4 次尝试
            PUSHED=0
            attempt=0
            while [ "$PUSHED" = "0" ] && [ "$attempt" -lt 4 ]; do
              attempt=$((attempt+1))
              if git push; then
                echo "✅ 推送成功（第 ${attempt} 次尝试）"
                PUSHED=1
                break
              fi
              echo "⚠️ 推送冲突（第 ${attempt} 次），fetch+rebase 后重试…"
              if git pull --rebase --autostash >/tmp/rebase_log.txt 2>&1; then
                echo "✅ rebase 干净，继续重试 push"
                continue
              fi
              echo "❌ rebase 有冲突——自动解决（重跑 publish 合并 manifest）…"
              if grep -q "gallery/cards.json\|gallery/curation.json" /tmp/rebase_log.txt; then
                # cards.json / curation.json 是脚本确定性更新（去重+新卡置顶）：
                # abort → 重置到最新 main → 重跑 publish（把本卡与远端已上线的卡合并）→ 重新提交
                git rebase --abort
                git fetch origin main
                git reset --hard origin/main
                PROJECT="generator/projects/$CARD_ID"
                ARGS="--project $PROJECT"
                if [ -n "${{ inputs.tags }}" ]; then ARGS="$ARGS --tags ${{ inputs.tags }}"; fi
                if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
                python3 generator/scripts/publish_card.py $ARGS
                git add "gallery/cards/$CARD_ID/"
                git add gallery/cards.json
                git add gallery/curation.json
                git add "generator/projects/$CARD_ID/assets/"
                git add "generator/projects/$CARD_ID/card-config.json"
                git commit -m "feat(card): render $CARD_ID via generic workflow (rebase-merged) [skip ci]"
                # 不 continue：while 条件会再 push
              else
                echo "❌ rebase 冲突文件非 manifest，无法自动解决"; exit 1
              fi
            done
            if [ "$PUSHED" = "0" ]; then echo "❌ 重试 4 次仍未推送成功"; exit 1; fi
          fi

      # 渲染产物 push 后自动部署 GitHub Pages（GITHUB_TOKEN 的 push 不触发 on:push，须显式 dispatch）
      - name: Deploy gallery to Pages
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            https://api.github.com/repos/Elijah-Lin-Dancer/Holo-Card-Studio/actions/workflows/deploy.yml/dispatches
          echo "✅ 已自动触发 Deploy workflow（GitHub Pages 更新）"
