name: Render Kenji Preview (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet Pillow numpy opencv-python-headless rembg onnxruntime fonttools

      - name: Fix vendor path
        run: cp gallery/vendor/three/build/three.module.js gallery/vendor/three/three.module.js 2>/dev/null || true

      - name: Run Blender pipeline
        run: |
          cd generator
          python scripts/run_pipeline.py --project ../.github/render-kenji

      - name: Link Blender to repo root (fix preview lookup)
        run: |
          mkdir -p tools
          cp -r .github/render-kenji/tools/blender-* tools/ 2>/dev/null || true
          ls tools/blender-*/blender && echo "Blender linked OK"

      - name: Publish card (with preview this time)
        run: |
          cd generator
          python scripts/publish_card.py \
            --project ../.github/render-kenji \
            --id kenji-kishimoto \
            --tags "小说,反乌托邦,隐身,日裔,Omega Point"

      - name: Cleanup
        run: rm -rf .github/render-kenji .github/workflows/render-kenji-preview.yml tools/blender-*

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add preview.webm rotation animation for Kenji Kishimoto card (cloud render)" --no-verify || echo "nothing to commit"
          git push
