name: gallery-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install --quiet pytest pillow numpy opencv-python-headless scipy fonttools

      - name: Pipeline unit tests
        run: pytest generator/tests -q

      - name: Frontend pure-function tests (node)
        run: node --test generator/tests-js/utils.test.mjs

      - name: Gallery health check
        run: python3 generator/scripts/verify_gallery.py

      - name: QA lightweight gate (G2/G3)
        run: python3 generator/qa/ci_gate.py

      - name: QA break-sample interception (G2/G3)
        run: python3 generator/qa/break_tests.py --lite
