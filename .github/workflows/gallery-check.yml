name: gallery-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install --quiet pytest pillow numpy

      - name: Pipeline unit tests
        run: pytest generator/tests -q

      - name: Gallery health check
        run: python3 generator/scripts/verify_gallery.py
